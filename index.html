<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Tani Selada</title>
<style>
:root{--bg:#f1f4ec;--card:#fff;--ink:#1c2a1f;--mute:#5d6b5f;--line:#d9e0d0;--green:#1e4b2e;--gold:#e3a008;--in:#1e7a3c;--out:#b5472b;--bubble:#1e4b2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a13;--card:#1b271e;--ink:#e8efe3;--mute:#9aab9c;--line:#2c3b2f;--green:#2f7a47;--in:#5cc57f;--out:#f08a6c;--bubble:#2f7a47}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
header{background:var(--green);color:#fff;padding:12px 16px}
header h1{font:700 19px/1.1 Georgia,"Times New Roman",serif;margin:0}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mute);font-size:15px;font-weight:600;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
section{display:none;flex:1;min-height:0;flex-direction:column}
section.on{display:flex}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--bubble);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px}
#chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:7px 12px;font-size:14px}
form{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
#in{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:22px;padding:11px 16px}
.rb{width:46px;height:46px;border-radius:50%;border:0;flex:none;font-size:20px;display:grid;place-items:center}
#mic{background:var(--bg);border:1px solid var(--line)}
#mic.rec{background:var(--out);color:#fff}
#send{background:var(--gold);color:#1c1400;font-weight:700}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gate{margin:10px 14px 0;padding:12px;border:1px solid var(--gold);border-radius:12px;background:var(--card)}
#chips button{flex:1;text-align:center}
#chips button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
#chips button:disabled,form.off{opacity:.5}
.btn.pri{background:var(--gold);color:#1c1400;border-color:var(--gold);font-weight:700}
.pad{padding:14px;overflow-y:auto;flex:1}
.day{font-weight:700;margin:14px 0 6px;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.row .t{flex:1;min-width:0}.row small{color:var(--mute);display:block}
.pill{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--mute)}
.in{color:var(--in);font-weight:700}.out{color:var(--out);font-weight:700}
.x{border:0;background:none;color:var(--mute);font-size:22px;padding:4px 8px}
h2{font:700 17px Georgia,serif;margin:22px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 10px}
.fl{display:block;margin:0 0 10px;font-size:14px;color:var(--mute)}
.fl input,.fl select,.fl textarea,.num{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13.5px}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12.5px}
td .num{padding:6px 8px;width:110px;text-align:right;margin:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;margin:8px 8px 0 0}
.empty{color:var(--mute);text-align:center;margin-top:40px}
.note{color:var(--mute);font-size:13px;margin:6px 0}
</style>
</head>
<body>
<header><h1>Catatan Usaha Tani Selada</h1></header>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="chat">Catat</button>
<button role="tab" aria-selected="false" data-t="list">Riwayat</button>
<button role="tab" aria-selected="false" data-t="lap">Laporan</button>
<button role="tab" aria-selected="false" data-t="prof">Profil</button>
</nav>
<main>
<section id="chat" class="on">
<div class="gate" id="gate" hidden></div>
<div id="log" aria-live="polite"></div>
<div id="chips"></div>
<form id="f" autocomplete="off">
<button type="button" id="mic" class="rb" aria-label="Bicara" hidden>🎤</button>
<input type="text" id="in" placeholder="Ceritakan kegiatan hari ini…" aria-label="Pesan">
<button class="rb" id="send" aria-label="Kirim">➤</button>
</form>
</section>
<section id="list"><div class="pad" id="lp"></div></section>
<section id="lap"><div class="pad" id="lapp"></div></section>
<section id="prof"><div class="pad" id="pp"></div></section>
</main>
<script>
(function(){
const KEY="catatan-tani-v2",FRESH=()=>({id:{},kel:[],rec:[],tl:{},dasar:"sama",keputusan:""});
let S=FRESH(),MODE="";
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fmt=n=>"Rp"+Math.round(n).toLocaleString("id-ID"),cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=["Bibit/benih","Pupuk","Pestisida/obat tanaman","Upah pekerja luar keluarga","Tenaga kerja keluarga","Sewa lahan","Bagi hasil","Air, listrik, bahan bakar","Panen, kemasan, dan transportasi","Lain-lain"];
const catOf=l=>/bibit|benih/.test(l)?CATS[0]:/pupuk/.test(l)?CATS[1]:/pestisida|obat|insektisida|fungisida|herbisida|semprot/.test(l)?CATS[2]:/upah|buruh|kuli|pekerja/.test(l)?CATS[3]:/sewa/.test(l)?CATS[5]:/bagi hasil/.test(l)?CATS[6]:/\bair\b|listrik|solar|bensin|bahan bakar|pompa/.test(l)?CATS[7]:/kemas|plastik|kardus|angkut|transport|ongkos|kirim|karung/.test(l)?CATS[8]:CATS[9];
const ACT=/tanam|semai|tebar|pupuk|semprot|siram|rawat|bersih|cabut|beli|bayar|upah|buruh|biaya|sewa|angkut|panen|jual|bibit|benih|obat|olah|bajak|cangkul|gulma|kemas|listrik|solar|bensin|terima|pasang|pindah|petik|kuli|ongkos/;
const QTY=/(\d+(?:[.,]\d+)?)\s*(kg|kilogram|kilo|ton|kwintal|kuintal|sak|karung|liter|botol|bungkus|pak|biji|bibit|batang|pohon|orang|hektar|ha|petak|bedeng|ekor|m2|m²|are)(?![a-z])/;
const BUY=/\b(?:ke|kepada|pembeli|sama)\s+((?:[Ii]bu|[Bb]u|[Bb]apak|[Pp]ak|[Tt]oko|[Pp]asar|[Ww]arung|[Pp]engepul|[Tt]engkulak)\b(?:\s+(?!harga|total|belum|sudah|kode|kelompok|dibayar|lunas|utang|per\b)[A-Za-z]\w*)?|[A-Z]\w+)/;
const DATEW=/\b(?:kemarin|kemaren|tadi|hari ini|\d+\s*hari\s*(?:yang\s*)?lalu|\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?)\b/gi;
const FAM=/istri|suami|anak|saya|sendiri|keluarga/i;
const num=s=>{s=String(s);return /^\d{1,3}(\.\d{3})+$/.test(s)?+s.replace(/\./g,""):parseFloat(s.replace(",","."))};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const kgOf=(n,u)=>u==="ton"?n*1000:/^k[wu]/.test(u)?n*100:n,r1=x=>Math.round(x*10)/10;
function money(s){const re=/(rp\.?\s*)?(\d{1,3}(?:\.\d{3})+|\d+(?:[.,]\d+)?)\s*(juta|jt|ribu|rb|k)?(?![a-z])/g,M={juta:1e6,jt:1e6,ribu:1e3,rb:1e3,k:1e3};let m;while((m=re.exec(s))){let v=num(m[2]);if(m[3])v*=M[m[3]];if(m[3]||m[1]||v>=1000)return v}return 0}
const KG="(\\d+(?:[.,]\\d+)?)\\s*(kg|kilogram|kilo|ton|kwintal|kuintal)(?![a-z])";
function kg1(s){const q=s.match(new RegExp(KG));return q?r1(kgOf(num(q[1]),q[2])):null}
function grab(s,w){const m=s.match(new RegExp("(?:"+w+")\\D{0,15}?"+KG))||s.match(new RegExp(KG+"\\s*(?:yang\\s*)?(?:"+w+")"));return m?{v:r1(kgOf(num(m[1]),m[2])),s:m[0]}:null}
function kodeOf(t,low){
 const m=t.match(/(?:kelompok|kode|klp|blok)(?:\s+tanam)?\s+([A-F](?:\s*(?:\+|&|,|dan)\s*[A-F])*)(?![a-z])/i)||t.match(/(?:^|[\s(])([A-E](?:\s*(?:\+|&|,|dan)\s*[A-E])*)(?=[\s).,]|$)/);
 const k=[...new Set((m?m[1].split(/\s*(?:\+|&|,|dan)\s*/i).map(s=>s.trim().toUpperCase()):[]).filter(s=>/^[A-F]$/.test(s)))].sort();
 return k.length?k.join("+"):/bersama|semua kelompok|semuanya/.test(low)?"Bersama":""}
function ensure(c){if(c&&c!=="Bersama"&&!S.kel.some(k=>k.kode===c))S.kel.push({kode:c,tgl:"",petak:"",luas:"",bibit:"",est:"",selesai:""})}
function parse(t,mode){
 let low=t.toLowerCase(),d=new Date(),m;
 if(/kemarin|kemaren/.test(low))d.setDate(d.getDate()-1);
 if((m=low.match(/(\d+)\s*hari\s*(?:yang\s*)?lalu/))){d.setDate(d.getDate()-m[1]);low=low.replace(m[0]," ")}
 if((m=low.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))){const y=m[3]?(m[3].length<3?2000+ +m[3]:+m[3]):d.getFullYear();d=new Date(y,m[2]-1,+m[1]);low=low.replace(m[0]," ")}
 let jam=0;if((m=low.match(/(\d+(?:[.,]\d+)?)\s*jam(?![a-z])/))){jam=num(m[1]);low=low.replace(m[0]," ")}
 const tgl=iso(d),kd=kodeOf(t,low),qm=low.match(QTY),rest=qm?low.replace(qm[0]," "):low,amt=money(rest),k="Selada",out={amt,kd,low};
 if(!mode&&!ACT.test(low))return out;
 let typ=mode||(/\bjual|terjual|dijual|\blaku\b/.test(low)?"j":/panen|manen/.test(low)?"p":"h");
 if(!mode&&typ==="p"&&/beli|bayar|upah|buruh|biaya|ongkos|sewa|kemas/.test(low))typ="h";
 if(typ==="p"){
  let s=low;const af=grab(s,"afkir|rusak|buang|reject|cacat");if(af)s=s.replace(af.s," ");
  const ly=grab(s,"layak|bagus|bisa dijual");if(ly)s=s.replace(ly.s," ");
  const tt=kg1(s),total=tt!=null?tt:r1((ly?ly.v:0)+(af?af.v:0));let layak,afkir;
  if(ly&&af){layak=ly.v;afkir=af.v}else if(af){afkir=af.v;layak=Math.max(0,r1(total-afkir))}else if(ly){layak=ly.v;afkir=Math.max(0,r1(total-layak))}else{layak=total;afkir=0}
  out.r={t:"p",tgl,kom:k,petak:(low.match(/petak\s*(\w+)/)||[])[1]||"",total,layak,afkir,cat:(t.match(/(?:ada|kondisi|karena|catatan)\s+[^,.]+/i)||[""])[0].split(/\s+(?:kode|kelompok)\b/i)[0],kode:kd,selesai:/selesai|tuntas|panen habis|habis panen/.test(low)};
 }else if(typ==="j"){
  const kg=kg1(low)||0,explicit=/\bper\b|\/\s*kg|perkilo|perkg|@/.test(rest),per=(explicit||(/\bharga\b/.test(rest)&&amt<=200000))&&!/total|nilai|jadi\b/.test(rest);
  const nilai=kg&&per?amt*kg:amt,pm=t.match(BUY),buyer=pm?pm[1].trim():"";
  out.r={t:"j",tgl,produk:k+(buyer?" / "+buyer:""),kg,harga:kg?Math.round(nilai/kg):0,nilai,bayar:/belum\s*(?:di)?bayar|utang|ngutang|tempo|kasbon|nanti/.test(low)?"Belum dibayar":"Sudah dibayar",kode:kd};
 }else{
  const per=/\bper\b|\btiap\b|@/.test(rest)&&!/total/.test(rest),mk=/terima|dapat uang|pemasukan|uang masuk|bantuan|subsidi/.test(low)&&!/beli|bayar/.test(low);
  const v=qm&&per?amt*num(qm[1]):amt,pf=(low.match(/istri|suami|anak|saya|sendiri|buruh|kuli|pekerja|tetangga|karyawan/g)||[]).filter((x,i,a)=>a.indexOf(x)===i).map(cap).join(" + ");
  const tc=t.replace(DATEW," ").replace(/\s+/g," ").trim(),keg=cap(tc.split(/,|\boleh\b|\bharga\b|\btotal\b|\brp\b|\bkode\b|\bkelompok\b|\bdibayar\b|\d+\s*(?:ribu|rb|juta|jt)|\d+\s*jam/i)[0].trim())||cap(tc);
  out.r={t:"h",tgl,keg,pel:pf||"Saya",jam,masuk:mk?v:0,keluar:mk?0:v,ket:v?(/belum\s*(?:di)?bayar|utang/.test(low)?"Belum dibayar":"Dibayar"):"",kode:kd,kat:(!mk&&v)?catOf(low):""};
 }
 if(out.r)out.r.id=Date.now()+Math.random();
 return out}
const title=r=>r.t==="h"?r.keg:r.t==="p"?"Panen "+(r.kom||"")+" "+r.total+" kg":"Jual "+r.produk+" "+r.kg+" kg";
function alloc(total,list,eq){
 const ls=list.map(c=>{const k=S.kel.find(x=>x.kode===c);return k?+String(k.luas).replace(",","."):0});
 const w=(!eq&&S.dasar==="luas"&&ls.every(v=>v>0))?ls:ls.map(()=>1),s=w.reduce((a,b)=>a+b,0),o={};
 list.forEach((c,i)=>o[c]=total*w[i]/s);return o}
function report(){
 const L=S.kel.map(k=>k.kode).sort(),cs=L.length?L:["-"];
 const ks=r=>{const k=r.kode||"";if(!k||k==="Bersama")return cs;const a=k.split("+").filter(c=>cs.includes(c));return a.length?a:cs};
 const per={},bers=[],cats={},T={panen:0,layak:0,afkir:0,kgJ:0,pen:0,lang:0,tl:0,jam:0,jamK:0,piutang:0};
 cs.forEach(c=>per[c]={kode:c,pen:0,lang:0,ber:0,lain:0,panen:0});CATS.forEach(c=>cats[c]=0);
 S.rec.forEach(r=>{const k=ks(r);
  if(r.t==="h"){T.jam+=r.jam||0;if(FAM.test(r.pel||""))T.jamK+=r.jam||0;
   if(r.keluar){T.lang+=r.keluar;cats[cats[r.kat]!=null?r.kat:CATS[9]]+=r.keluar;
    if(k.length===1&&r.kode&&r.kode!=="Bersama")per[k[0]].lang+=r.keluar;
    else{const a=alloc(r.keluar,k);k.forEach(c=>per[c].ber+=a[c]);bers.push({r,a})}}}
  else if(r.t==="p"){T.panen+=r.total||0;T.layak+=r.layak||0;T.afkir+=r.afkir||0;const a=alloc(r.total||0,k,true);k.forEach(c=>per[c].panen+=a[c])}
  else{T.kgJ+=r.kg||0;T.pen+=r.nilai||0;if(r.bayar==="Belum dibayar")T.piutang+=r.nilai||0;const a=alloc(r.nilai||0,k,true);k.forEach(c=>per[c].pen+=a[c])}});
 T.tl=CATS.reduce((s,c)=>s+(+S.tl[c]||0),0);const at=alloc(T.tl,cs,false);cs.forEach(c=>per[c].lain=at[c]);
 T.biaya=T.lang+T.tl;T.laba=T.pen-T.biaya;
 return{L:cs,per:cs.map(c=>per[c]),bers,cats,tot:T}}
function query(low,t){
 if(!S.rec.length)return"Belum ada catatan.";
 const R=report(),T=R.tot,m=t.match(/(?:kelompok|kode|klp)\s+([A-F])(?![a-z])/i),kd=m?m[1].toUpperCase():"";
 if(/belum.*bayar|piutang|utang/.test(low)){const u=S.rec.filter(r=>r.t==="j"&&r.bayar==="Belum dibayar");return u.length?"Belum dibayar "+fmt(T.piutang)+":\n"+u.map(r=>"• "+r.produk+" "+fmt(r.nilai)).join("\n"):"Semua penjualan sudah dibayar."}
 const row=kd?R.per.find(x=>x.kode===kd):null;if(kd&&!row)return"Kelompok "+kd+" belum ada.";
 const pen=row?row.pen:T.pen,biaya=row?row.lang+row.ber+row.lain:T.biaya,laba=pen-biaya,w=kd?" kelompok "+kd:"",kl=kd?S.kel.find(x=>x.kode===kd):null;
 const open=kd?(kl&&!kl.selesai):S.kel.some(k=>!k.selesai),nt=open?"\nCatatan: belum semua kelompok selesai panen, jadi belum final.":"";
 if(/untung|laba|rugi/.test(low))return(laba>=0?"Untung":"Rugi")+w+": "+fmt(Math.abs(laba))+"\n(penjualan "+fmt(pen)+" − biaya "+fmt(biaya)+")"+nt;
 if(/pengeluaran|biaya|habis/.test(low))return"Biaya"+w+": "+fmt(biaya);
 if(/pemasukan|penjualan|pendapatan/.test(low))return"Penjualan"+w+": "+fmt(pen);
 if(/panen/.test(low))return"Panen"+w+": "+r1(row?row.panen:T.panen)+" kg";
 if(/jam|tenaga/.test(low))return"Jam kerja tercatat: "+r1(T.jam)+" jam (keluarga "+r1(T.jamK)+" jam)";
 return"Ringkasan"+w+":\nPenjualan "+fmt(pen)+"\nBiaya "+fmt(biaya)+"\n"+(laba>=0?"Untung ":"Rugi ")+fmt(Math.abs(laba))+"\nPanen "+r1(row?row.panen:T.panen)+" kg"+nt}
function handle(t){
 const low=t.toLowerCase().trim(),last=S.rec[S.rec.length-1];
 if(!profOK())return"Isi dulu data diri di tab Profil.";
 if(/hapus|batal|undo/.test(low)&&/terakhir|tadi|barusan|itu/.test(low)){const x=S.rec.pop();save();return x?"Dihapus: "+title(x):"Belum ada catatan."}
 const p=parse(t,MODE),kd=p.kd;
 if(last&&/^(untuk\s+)?(kode|kelompok|klp)\b/.test(low)&&kd&&!ACT.test(low.replace(/kode|kelompok|tanam/g,""))){last.kode=kd;kd.split("+").forEach(ensure);save();return"Diperbarui: kode "+kd+" untuk "+title(last)}
 if(last&&last.t==="j"&&/^(sudah|belum|lunas)/.test(low)&&/bayar|lunas/.test(low)){last.bayar=/belum/.test(low)?"Belum dibayar":"Sudah dibayar";save();return"Diperbarui: "+title(last)+" — "+last.bayar}
 if(p.amt&&last&&/^(harga|total|totalnya|seharga|biayanya|jadi)\b/.test(low)){
  const per=/\bper\b|\/|@|tiap/.test(low);
  if(last.t==="j"){last.nilai=per&&last.kg?p.amt*last.kg:p.amt;last.harga=last.kg?Math.round(last.nilai/last.kg):0}
  else if(last.t==="h"){last.keluar=p.amt;last.kat=catOf(last.keg.toLowerCase());last.ket="Dibayar"}
  else return"Catatan panen tidak memakai harga.";
  save();return"Diperbarui: "+title(last)+(last.t==="j"?", "+fmt(last.nilai):", "+fmt(last.keluar))}
 if(/berapa|\?/.test(low)||/^(total|untung|rugi|laba|rekap|ringkas|lihat|siapa)/.test(low))return query(low,t);
 const r=p.r;
 if(!r)return"Aku belum paham. Coba tulis seperti:\n• tanam selada kelompok A 200 m2 bibit 500\n• beli bibit 80 ribu istri 1 jam kode A\n• panen selada A total 100 kg afkir 10 kg\n• jual selada 25 kg ke Ibu Ayu harga 10 ribu per kilo kode A\nAtau tanya: untung kelompok A berapa?";
